<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate — MLB Predictions</title>
<link rel="icon" type="image/webp" href="/mlb-logo.webp">
<link rel="apple-touch-icon" href="/mlb-logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <img class="brand-icon" src="/mlb-logo.webp" alt="">
    </span>
    <div class="brand-text">
      <span class="brand-title">SLATE</span>
      <span class="brand-sub">MLB Predictions</span>
    </div>
  </div>

</header>

<nav class="date-strip" id="dateStrip">
  <div class="date-strip-label">DATE</div>
  <div class="date-tiles" id="dateTiles">
    <div class="empty-note">Loading dates…</div>
  </div>
</nav>

<main class="layout">
  <aside class="stat-rail" id="statRail">
    <div class="empty-note">Loading categories…</div>
  </aside>

  <section class="board">
    <div class="board-header">
      <div>
        <h1 id="statTitle">Select a stat sheet</h1>
        <p id="statMeta" class="board-meta">&nbsp;</p>
      </div>
      <div class="board-controls" id="boardControls" hidden></div>
    </div>

    <div id="statusArea" class="status-area"></div>

    <div class="scorecard" id="scorecard" hidden>
      <div class="scorecard-header"><span class="scorecard-label">Prediction performance</span></div>
      <div id="statsPeriods" class="stats-periods" aria-label="Stats period"></div>
      <div id="statsContent" class="table-scroll stats-content"></div>
      <details class="stats-definitions"><summary>Metric definitions</summary><div id="statsDefinitions"></div></details>
    </div>

    <p id="predictionStatus" class="board-meta" aria-live="polite"></p>
    <div class="table-card" id="tableCard" hidden>
      <div class="table-scroll">
        <table id="dataTable">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
